<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>무료로 선물을 드립니다</title>

  <!-- 링크 미리보기 -->
  <meta property="og:title" content="무료로 선물을 드립니다">
  <meta property="og:description" content="무료로 선물을 드립니다">
  <meta name="description" content="무료로 선물을 드립니다">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F5F6FA;
    }

    /* 배경 화면 */
    #main {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      background-color: #F5F6FA;
      background-image: url("images/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 가운데 버튼 이미지 */
    #startButton {
      display: flex;
      justify-content: center;
      align-items: center;

      width: min(80vw, 420px);
      max-height: 80vh;

      border: none;
      background: transparent;
      cursor: pointer;
    }

    #startButton img {
      display: block;
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    /* 영상 화면 */
    #scareScreen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
    }

    /* 영상 - 모바일에서 세로로 들고 있어도 강제로 가로 꽉 차게 보이도록 회전 및 크기 조절 */
    #video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vh;
      height: 100vw;
      object-fit: cover;
      transform: translate(-50%, -50%) rotate(90deg);
      transform-origin: center;
    }

    /* 만약 기기가 이미 가로 방향이거나 PC인 경우 회전 해제 */
    @media (orientation: landscape) {
      #video {
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%) rotate(0deg);
      }
    }
  </style>
</head>

<body>

  <!-- 시작 화면 -->
  <div id="main">
    <button id="startButton" type="button">
      <img src="images/button.png" alt="시작">
    </button>
  </div>

  <!-- 영상 화면 -->
  <div id="scareScreen">
    <video
      id="video"
      src="videos/scare.mp4"
      loop
      playsinline
      preload="auto"
      controls
    ></video>
  </div>

  <script>
    const main = document.getElementById("main");
    const button = document.getElementById("startButton");
    const screen = document.getElementById("scareScreen");
    const video = document.getElementById("video");

    let started = false;

    button.addEventListener("click", async function() {
      if (started) return;
      started = true;

      main.style.display = "none";
      screen.style.display = "block";

      // 영상 소리 켜기
      video.muted = false;

      // 전체 화면 전환 시도
      try {
        if (screen.requestFullscreen) {
          await screen.requestFullscreen();
        } else if (screen.webkitRequestFullscreen) { /* 아이폰 사파리 대응 */
          await screen.webkitRequestFullscreen();
        }
      } catch (error) {
        console.log("전체 화면 전환 실패:", error);
      }

      // 기기 자체의 강제 화면 회전 시도 (지원하는 브라우저용)
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        console.log("가로 화면 고정 미지원 (CSS 회전으로 대체됨):", error);
      }

      // 영상 재생
      try {
        await video.play();
      } catch (error) {
        console.log("영상 재생 실패:", error);
      }
    });
  </script>

</body>
</html>
