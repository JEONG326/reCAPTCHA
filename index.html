<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verification</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/* 처음 이미지 화면 */
#main {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#startImage {
    width: 100%;
    height: 100%;
    object-fit: contain;
    cursor: pointer;
}

/* 영상 화면 */
#scareScreen {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

#video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* 전체 화면 */
#scareScreen:fullscreen {
    width: 100vw;
    height: 100vh;
    background: #000;
}

#scareScreen:fullscreen video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
</style>

</head>

<body>

<!-- 시작 이미지 -->
<div id="main">

    <img
        id="startImage"
        src="images/start.jpg"
        alt="Click to continue"
    >

</div>

<!-- 영상 화면 -->
<div id="scareScreen">

    <video
        id="video"
        src="videos/scare.mp4"
        loop
        playsinline
        preload="auto"
        controls
    ></video>

</div>

<script>

const image = document.getElementById("startImage");
const screen = document.getElementById("scareScreen");
const video = document.getElementById("video");
const main = document.getElementById("main");

image.addEventListener("click", async function() {

    // 중복 클릭 방지
    image.style.pointerEvents = "none";

    // 이미지 화면 숨기기
    main.style.display = "none";

    // 영상 화면 표시
    screen.style.display = "block";

    // 전체 화면 전환 시도
    try {
        await screen.requestFullscreen();
    } catch (error) {
        console.log("전체 화면 전환이 지원되지 않습니다.");
    }

    // 영상 재생
    try {
        await video.play();
    } catch (error) {
        console.log("영상 재생에 실패했습니다.", error);
    }

});

</script>

</body>
</html>
