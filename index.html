<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>무료로 선물을 드립니다</title>

  <!-- 링크 미리보기 -->
  <meta property="og:title" content="무료로 선물을 드립니다">
  <meta property="og:description" content="무료로 선물을 드립니다">
  <meta name="description" content="무료로 선물을 드립니다">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* 배경 화면 */
    #main {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      background-color: #F5F6FA;
      background-image: url("images/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* 가운데 버튼 이미지 */
    #startButton {
      display: flex;
      justify-content: center;
      align-items: center;

      width: min(80vw, 420px);
      max-height: 80vh;

      border: none;
      background: transparent;
      cursor: pointer;
    }

    #startButton img {
      display: block;
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    /* 영상 화면 컨테이너 */
    #scareScreen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
      overflow: hidden;
    }

    /* 영상 스타일 */
    #video {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      object-fit: cover;
    }

    /* 1. 세로 모드일 때: 화면 전체를 90도 강제 회전시켜 게임 가로모드처럼 만듦 */
    @media (orientation: portrait) {
      #video {
        width: 100vh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }

    /* 2. 이미 가로 모드일 때: 회전 없이 꽉 채움 */
    @media (orientation: landscape) {
      #video {
        width: 100vw;
        height: 100vh;
        transform: translate(-50%, -50%) rotate(0deg);
      }
    }
  </style>
</head>

<body>

  <!-- 시작 화면 -->
  <div id="main">
    <button id="startButton" type="button">
      <img src="images/button.png" alt="시작">
    </button>
  </div>

  <!-- 영상 화면 -->
  <div id="scareScreen">
    <video
      id="video"
      src="videos/scare.mp4"
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>
  </div>

  <script>
    const main = document.getElementById("main");
    const button = document.getElementById("startButton");
    const screen = document.getElementById("scareScreen");
    const video = document.getElementById("video");

    let started = false;

    button.addEventListener("click", async function() {
      if (started) return;
      started = true;

      // 1. 메인 화면 숨기고 영상 화면 켜기
      main.style.display = "none";
      screen.style.display = "block";

      // 2. 소리 켜기
      video.muted = false;

      // 3. 브라우저 전체 화면 전환 시도
      try {
        if (screen.requestFullscreen) {
          await screen.requestFullscreen();
        } else if (screen.webkitRequestFullscreen) {
          await screen.webkitRequestFullscreen();
        }
      } catch (e) {
        console.log("전체화면 모드 거부됨 (CSS 회전으로 대체)");
      }

      // 4. 모바일 기기 화면 방향 고정 시도 (지원하는 단말기용)
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (e) {
        console.log("화면 회전 잠금 미지원 단말기");
      }

      // 5. 영상 재생
      try {
        await video.play();
      } catch (error) {
        console.log("영상 자동재생 실패:", error);
      }
    });
  </script>

</body>
</html>
